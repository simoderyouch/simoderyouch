<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed ED Deryouch — cloud and DevOps builder</title>
  <desc id="desc">An animated cloud infrastructure map and terminal interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0a2740"/>
      <stop offset="1" stop-color="#081827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop stop-color="#38bdf8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#bae6fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 10 16; animation: flow 4s linear infinite; }
      .flow-slow { stroke-dasharray: 5 20; animation: flow 7s linear infinite reverse; }
      .pulse { transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .pulse-late { transform-origin: center; animation: pulse 2.4s ease-in-out .8s infinite; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      .orbit { transform-origin: 1044px 178px; animation: orbit 9s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -104; } }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.45); } }
      @keyframes blink { 50% { opacity:0; } }
      @keyframes orbit { to { transform:rotate(360deg); } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#background)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="206" cy="110" rx="270" ry="190" fill="url(#halo)"/>
  <ellipse cx="1080" cy="186" rx="225" ry="170" fill="url(#halo)" opacity=".7"/>

  <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".85">
    <path class="flow" d="M620 90 C735 30 795 80 875 120 S1040 125 1120 75"/>
    <path class="flow-slow" d="M580 250 C700 300 760 215 865 230 S1010 315 1160 250"/>
    <path class="flow" d="M720 170 C790 145 820 155 890 178 S1040 180 1122 165"/>
    <path class="flow-slow" d="M642 135 C714 140 752 196 821 202 S915 90 1000 94"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="92" y="92" fill="#7dd3fc" font-size="14" letter-spacing="4">HELLO, WORLD_</text>
    <text x="88" y="152" fill="#f8fafc" font-size="42" font-weight="700" letter-spacing="-1">MOHAMED ED</text>
    <text x="88" y="202" fill="#f8fafc" font-size="42" font-weight="700" letter-spacing="-1">DERYOUCH</text>
    <rect x="90" y="230" width="270" height="32" rx="16" fill="#0f3552" stroke="#38bdf8" stroke-opacity=".55"/>
    <circle cx="108" cy="246" r="4" fill="#38bdf8" class="pulse"/>
    <text x="122" y="251" fill="#bae6fd" font-size="13" letter-spacing="1.4">BUILD · AUTOMATE · DEPLOY</text>
    <text x="91" y="304" fill="#94a3b8" font-size="14">cloud / devops / systems</text>
  </g>

  <g transform="translate(778 88)">
    <rect width="390" height="190" rx="12" fill="#07111f" fill-opacity=".86" stroke="#38bdf8" stroke-opacity=".42"/>
    <path d="M0 38H390" stroke="#38bdf8" stroke-opacity=".24"/>
    <circle cx="22" cy="19" r="5" fill="#fb7185"/><circle cx="41" cy="19" r="5" fill="#fbbf24"/><circle cx="60" cy="19" r="5" fill="#34d399"/>
    <text x="82" y="24" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">infrastructure.sh</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
      <text x="24" y="72" fill="#38bdf8">$</text><text x="42" y="72" fill="#e2e8f0"> provision --cloud</text>
      <text x="24" y="103" fill="#34d399">✓</text><text x="42" y="103" fill="#cbd5e1"> automation online</text>
      <text x="24" y="134" fill="#a78bfa">↗</text><text x="42" y="134" fill="#cbd5e1"> pipelines ready</text>
      <text x="24" y="165" fill="#38bdf8">$</text><rect class="cursor" x="42" y="153" width="9" height="15" fill="#38bdf8"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle cx="875" cy="120" r="5" fill="#38bdf8" class="pulse"/>
    <circle cx="1000" cy="94" r="5" fill="#a78bfa" class="pulse-late"/>
    <circle cx="1120" cy="75" r="5" fill="#38bdf8" class="pulse"/>
    <circle cx="865" cy="230" r="5" fill="#a78bfa" class="pulse-late"/>
    <circle cx="1122" cy="165" r="5" fill="#38bdf8" class="pulse-late"/>
  </g>
  <g class="orbit" filter="url(#glow)">
    <circle cx="1044" cy="128" r="3.5" fill="#f8fafc"/>
  </g>
</svg>
