<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed ED Deryouch — Software Engineer</title>
  <desc id="desc">A modern software engineering banner with a code editor panel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a1020"/>
      <stop offset=".5" stop-color="#101b38"/>
      <stop offset="1" stop-color="#13102d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#182540" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0b1224" stop-opacity=".98"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/></filter>
    <style>
      .card { animation: float 5s ease-in-out infinite; }
      .spark { animation: glow 2.6s ease-in-out infinite; }
      .reveal { stroke-dasharray: 220; stroke-dashoffset: 220; animation: reveal 2.3s ease-out .45s forwards; }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
      @keyframes glow { 0%,100% { opacity:.45; } 50% { opacity:1; } }
      @keyframes reveal { to { stroke-dashoffset:0; } }
    </style>
  </defs>

  <rect width="1280" height="400" rx="18" fill="url(#background)"/>
  <circle cx="102" cy="75" r="180" fill="#0ea5e9" opacity=".12" filter="url(#blur)"/>
  <circle cx="1160" cy="330" r="210" fill="#8b5cf6" opacity=".14" filter="url(#blur)"/>
  <path d="M-35 338C165 252 236 414 448 329C590 272 626 192 761 160" fill="none" stroke="#93c5fd" stroke-opacity=".11" stroke-width="2"/>
  <path d="M-30 362C186 278 267 427 474 347C606 296 655 214 760 184" fill="none" stroke="#c4b5fd" stroke-opacity=".09" stroke-width="2"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="85" y="104" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="4">PORTFOLIO / 2026</text>
    <text x="80" y="170" fill="#f8fafc" font-size="47" font-weight="750" letter-spacing="-1.5">MOHAMED ED</text>
    <text x="80" y="226" fill="#f8fafc" font-size="47" font-weight="750" letter-spacing="-1.5">DERYOUCH</text>
    <rect x="84" y="254" width="213" height="35" rx="17.5" fill="#172b4d" stroke="#38bdf8" stroke-opacity=".6"/>
    <text x="105" y="277" fill="#dbeafe" font-size="14" font-weight="700" letter-spacing="1.6">SOFTWARE ENGINEER</text>
    <text x="84" y="334" fill="#a5b4c9" font-size="16">build thoughtfully · deploy confidently</text>
  </g>

  <g class="card" transform="translate(746 73)" filter="url(#shadow)">
    <rect width="438" height="252" rx="16" fill="url(#card)" stroke="#64748b" stroke-opacity=".55"/>
    <path d="M0 47H438" stroke="#64748b" stroke-opacity=".45"/>
    <circle cx="25" cy="24" r="6" fill="#fb7185"/><circle cx="47" cy="24" r="6" fill="#fbbf24"/><circle cx="69" cy="24" r="6" fill="#34d399"/>
    <text x="103" y="29" fill="#b6c5da" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ship.ts</text>
    <rect x="0" y="47" width="56" height="205" rx="0" fill="#0b1224"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
      <text x="20" y="84" fill="#50627e">1</text><text x="20" y="116" fill="#50627e">2</text><text x="20" y="148" fill="#50627e">3</text><text x="20" y="180" fill="#50627e">4</text><text x="20" y="212" fill="#50627e">5</text>
      <text x="80" y="84" fill="#c4b5fd">export</text><text x="130" y="84" fill="#e2e8f0"> const </text><text x="184" y="84" fill="#7dd3fc">ship</text><text x="219" y="84" fill="#e2e8f0"> = (idea) =&gt; {</text>
      <text x="100" y="116" fill="#93c5fd">design</text><text x="151" y="116" fill="#cbd5e1">: </text><text x="165" y="116" fill="#fbbf24">true</text><text x="199" y="116" fill="#cbd5e1">,</text>
      <text x="100" y="148" fill="#93c5fd">build</text><text x="143" y="148" fill="#cbd5e1">: </text><text x="157" y="148" fill="#fbbf24">true</text><text x="191" y="148" fill="#cbd5e1">,</text>
      <text x="100" y="180" fill="#93c5fd">deploy</text><text x="151" y="180" fill="#cbd5e1">: </text><text x="165" y="180" fill="#fbbf24">true</text>
      <text x="80" y="212" fill="#e2e8f0">};</text>
    </g>
    <path class="reveal" d="M80 228H340" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle class="spark" cx="360" cy="228" r="4" fill="#7dd3fc"/>
  </g>
</svg>
