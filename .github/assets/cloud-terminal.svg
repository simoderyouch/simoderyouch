<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed ED Deryouch — Software Engineer and AI Engineer</title>
  <desc id="desc">An animated terminal showing an application being built and deployed.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset=".55" stop-color="#101622"/>
      <stop offset="1" stop-color="#071d2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cursor { animation: blink 1s steps(2, start) infinite; }
      .run { stroke-dasharray: 260; stroke-dashoffset: 260; animation: run 2.7s ease-out .35s forwards; }
      .line1 { opacity: 0; animation: show .2s ease-out .3s forwards; }
      .line2 { opacity: 0; animation: show .2s ease-out .85s forwards; }
      .line3 { opacity: 0; animation: show .2s ease-out 1.4s forwards; }
      .line4 { opacity: 0; animation: show .2s ease-out 1.95s forwards; }
      .shine { animation: shine 4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes run { to { stroke-dashoffset: 0; } }
      @keyframes show { to { opacity: 1; } }
      @keyframes shine { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1280" height="400" rx="18" fill="url(#page)"/>
  <rect x="44" y="36" width="1192" height="328" rx="16" fill="url(#panel)" stroke="#334155" stroke-width="1"/>
  <path d="M44 95H1236" stroke="#334155"/>
  <circle cx="76" cy="66" r="7" fill="#fb7185"/>
  <circle cx="101" cy="66" r="7" fill="#fbbf24"/>
  <circle cx="126" cy="66" r="7" fill="#34d399"/>
  <text x="160" y="71" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">mohamed@workspace — deployment console</text>
  <rect x="44" y="94" width="1192" height="2" fill="url(#accent)" opacity=".65"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="92" y="145" fill="#22d3ee" font-size="14" letter-spacing="3">SOFTWARE ENGINEER · AI ENGINEER</text>
    <text x="88" y="205" fill="#f8fafc" font-size="39" font-weight="700" letter-spacing="-1">MOHAMED ED DERYOUCH</text>
    <text x="91" y="242" fill="#94a3b8" font-size="16">designing, building &amp; deploying intelligent software</text>
    <text x="92" y="294" fill="#64748b" font-size="14">interests: cloud infrastructure / devops / automation</text>
    <text x="92" y="326" fill="#38bdf8" font-size="15">$</text>
    <text x="111" y="326" fill="#e2e8f0" font-size="15">ship --with-purpose</text>
    <rect class="cursor" x="267" y="312" width="9" height="17" fill="#38bdf8"/>
  </g>

  <g transform="translate(760 128)">
    <rect width="412" height="182" rx="10" fill="#060b13" stroke="#334155"/>
    <rect x="0" y="0" width="5" height="182" rx="2.5" fill="url(#accent)" class="shine"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
      <g class="line1"><text x="28" y="38" fill="#22d3ee">$</text><text x="48" y="38" fill="#cbd5e1"> build --target production</text></g>
      <g class="line2"><text x="28" y="70" fill="#34d399">✓</text><text x="48" y="70" fill="#cbd5e1"> application compiled</text></g>
      <g class="line3"><text x="28" y="102" fill="#34d399">✓</text><text x="48" y="102" fill="#cbd5e1"> AI services connected</text></g>
      <g class="line4"><text x="28" y="134" fill="#a78bfa">↗</text><text x="48" y="134" fill="#e2e8f0"> deployment complete</text></g>
    </g>
    <rect x="28" y="151" width="340" height="5" rx="2.5" fill="#1e293b"/>
    <path class="run" d="M30 153.5H366" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"/>
  </g>

  <path d="M82 361H1198" stroke="url(#accent)" stroke-width="2" opacity=".7"/>
</svg>
